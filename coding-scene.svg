<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Animated illustration of a laptop with code being typed, a coffee cup and floating code symbols" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft glow behind the laptop -->
  <ellipse cx="450" cy="150" rx="260" ry="95" fill="#9ec9c2" opacity="0.18"/>

  <!-- twinkling stars -->
  <g fill="#7fb7ae">
    <circle cx="150" cy="60" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="140" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code symbols -->
  <g font-family="'Fira Code', 'Consolas', monospace" font-weight="600">
    <text x="215" y="95" font-size="26" fill="#6b9ac4">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="665" y="85" font-size="26" fill="#7fb7ae">{ }
      <animateTransform attributeName="transform" type="translate" values="0 -8; 0 6; 0 -8" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="165" y="185" font-size="20" fill="#b7a8e0">UX
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="725" y="190" font-size="20" fill="#e3a98a">AI
      <animateTransform attributeName="transform" type="translate" values="0 -6; 0 8; 0 -6" dur="4.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- laptop base -->
  <rect x="300" y="208" width="300" height="14" rx="7" fill="#a9bccf"/>
  <rect x="410" y="208" width="80" height="5" rx="2.5" fill="#8ea3b8"/>
  <!-- laptop screen -->
  <rect x="335" y="52" width="230" height="156" rx="12" fill="#a9bccf"/>
  <rect x="343" y="60" width="214" height="140" rx="7" fill="#2f4858"/>

  <!-- window dots -->
  <circle cx="357" cy="72" r="3" fill="#e08a8a"/>
  <circle cx="368" cy="72" r="3" fill="#e8c27a"/>
  <circle cx="379" cy="72" r="3" fill="#7fb7ae"/>

  <!-- code lines being typed -->
  <rect x="357" y="88" width="0" height="8" rx="4" fill="#7fb7ae">
    <animate attributeName="width" values="0;110;110;0" keyTimes="0;0.25;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="371" y="106" width="0" height="8" rx="4" fill="#6b9ac4">
    <animate attributeName="width" values="0;0;130;130;0" keyTimes="0;0.2;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="371" y="124" width="0" height="8" rx="4" fill="#e3a98a">
    <animate attributeName="width" values="0;0;0;90;90;0" keyTimes="0;0.35;0.5;0.65;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="357" y="142" width="0" height="8" rx="4" fill="#b7a8e0">
    <animate attributeName="width" values="0;0;0;0;120;120;0" keyTimes="0;0.5;0.6;0.65;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="357" y="160" width="0" height="8" rx="4" fill="#7fb7ae">
    <animate attributeName="width" values="0;0;0;0;0;70;70;0" keyTimes="0;0.6;0.7;0.75;0.8;0.92;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="438" y="176" width="7" height="12" rx="2" fill="#cfe8e4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- coffee cup -->
  <g>
    <rect x="640" y="176" width="38" height="32" rx="8" fill="#f1d7c3"/>
    <path d="M678 184 q16 0 16 12 q0 12 -16 12" fill="none" stroke="#f1d7c3" stroke-width="5" stroke-linecap="round"/>
    <rect x="632" y="208" width="54" height="5" rx="2.5" fill="#d9bfa8"/>
    <!-- steam -->
    <path d="M650 168 q-6 -10 0 -20" fill="none" stroke="#9fb4c7" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M664 168 q-6 -10 0 -20" fill="none" stroke="#9fb4c7" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- small plant on the left -->
  <g>
    <rect x="228" y="190" width="30" height="24" rx="6" fill="#d9bfa8"/>
    <g transform-origin="243 190">
      <path d="M243 190 q-14 -22 -6 -38 q12 12 6 38" fill="#7fb7ae"/>
      <path d="M243 190 q14 -18 8 -34 q-14 10 -8 34" fill="#9ec9c2"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 243 190; 3 243 190; -3 243 190" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
